type: custom:button-card
show_name: false
show_icon: false
show_state: false
tap_action:
  action: none
grid_options:
  columns: full
  rows: auto
triggers_update:
  - sensor.pylontech_force_h3x_grid_total_power
  - sensor.pylontech_force_h3x_grid_power_r
  - sensor.pylontech_force_h3x_grid_power_s
  - sensor.pylontech_force_h3x_grid_power_t
  - sensor.pylontech_force_h3x_pv_total_power
  - sensor.pylontech_force_h3x_pv1_power
  - sensor.pylontech_force_h3x_ac_total_power
  - select.pylontech_force_h3x_ems_mode
  - sensor.pylontech_force_h3x_heatsink_temperature
  - sensor.pylontech_force_h3x_battery_power
  - sensor.pylontech_force_h3x_battery_soc
  - sensor.pylontech_force_h3x_battery_voltage
  - sensor.pylontech_force_h3x_battery_current
  - sensor.pylontech_force_h3x_load_power
styles:
  card:
    - padding: 8px
  grid:
    - grid-template-areas: '"flow"'
    - grid-template-columns: 1fr
  custom_fields:
    flow:
      - width: 100%
extra_styles: |
  @keyframes pfflow { to { stroke-dashoffset: -12; } }
  .pt  { font-size: 13px;   font-weight: 500; fill: var(--primary-text-color); }
  .pb  { font-size: 24px;   fill: var(--primary-text-color); }
  .pb2 { font-size: 30px;   font-weight: 500; fill: var(--primary-text-color); }
  .ps  { font-size: 11.5px; fill: var(--secondary-text-color); }
custom_fields:
  flow: |
    [[[
      // ---- Configuratie: alleen hier aanpassen ----
      const CFG = {
        netLabel: "Net (SDM630)",   // titel van het netblok
        net: ["sensor.pylontech_force_h3x_grid_total_power"],   // netvermogen (W, afname +); meerdere sensoren worden opgeteld
        netPhases: ["sensor.pylontech_force_h3x_grid_power_r", "sensor.pylontech_force_h3x_grid_power_s", "sensor.pylontech_force_h3x_grid_power_t"],   // per fase getoond onder het netblok (leeg = niet tonen)
        schuur: [],   // AC-gekoppelde PV (leeg = blok weg, kaart wordt korter)
        pv: "sensor.pylontech_force_h3x_pv_total_power",   // totaal PV-vermogen op de H3X (DC)
        pvStrings: [["PV1", "sensor.pylontech_force_h3x_pv1_power"]],   // strings onder het PV-blok: [label, sensor]
        ac: "sensor.pylontech_force_h3x_ac_total_power",
        ems: "select.pylontech_force_h3x_ems_mode",
        heat: "sensor.pylontech_force_h3x_heatsink_temperature",
        batP: "sensor.pylontech_force_h3x_battery_power",   // batterijvermogen (ontladen +)
        soc: "sensor.pylontech_force_h3x_battery_soc",
        batV: "sensor.pylontech_force_h3x_battery_voltage",
        batA: "sensor.pylontech_force_h3x_battery_current",
        batKwh: null,   // resterende kWh-sensor; null = berekenen uit SoC x capacity
        capacity: 10.24,   // batterijcapaciteit in kWh (alleen als batKwh null is)
        huis: "sensor.pylontech_force_h3x_load_power",   // totale load
        idle: 25,   // W: daaronder lijn grijs en stil
        netIdle: 100,   // W: drempel net (gelijk aan mushroom Net Status)
      };

      // ---- Helpers ----
      // Leest een sensor als getal in W (kW/kVA worden omgerekend).
      const num = (id) => {
        if (!id) return NaN;
        const s = states[id];
        if (!s) return NaN;
        let v = parseFloat(s.state);
        if (!Number.isFinite(v)) return NaN;
        const u = (s.attributes && s.attributes.unit_of_measurement) || '';
        if (u === 'kW' || u === 'kVA') v *= 1000;
        return v;
      };
      const unit = (id, dflt) => (states[id] && states[id].attributes.unit_of_measurement) || dflt;
      const sum = (ids) => {
        if (!ids || !ids.length) return NaN;
        let t = 0;
        for (const id of ids) { const v = num(id); if (Number.isNaN(v)) return NaN; t += v; }
        return t;
      };
      const minus = (s) => s.replace('-', '−');
      const fW  = (v) => Number.isNaN(v) ? '—' : Math.round(Math.abs(v)).toLocaleString('nl-NL') + ' W';
      const fWs = (v) => Number.isNaN(v) ? '—' : minus(Math.round(v).toLocaleString('nl-NL'));
      const f1  = (v, u) => Number.isNaN(v) ? '—'
        : minus(v.toLocaleString('nl-NL', {minimumFractionDigits: 1, maximumFractionDigits: 1})) + u;
      const now = Date.now() / 1000;
      let defs = '';

      // Kleuren per blok: [rand, vulling]. Werkt in licht en donker thema.
      const C = {
        pv:   ['#f9a825', 'rgba(255, 213, 79, 0.16)'],
        net:  ['#1e88e5', 'rgba(33, 150, 243, 0.14)'],
        bat:  ['#43a047', 'rgba(76, 175, 80, 0.14)'],
        huis: ['#e53935', 'rgba(244, 67, 54, 0.12)'],
        h3x:  ['var(--secondary-text-color)', 'var(--secondary-background-color)'],
      };

      // Stroomlijn: w > 0 = stroom in tekenrichting van het pad, w < 0 = tegengesteld.
      // De animatiefase volgt de klok, zodat een her-render elke seconde niet hapert.
      // bus = true: a rail segment; when idle it draws nothing, so the solid rail shows.
      const line = (id, d, w, color, idle = CFG.idle, bus = false) => {
        if (Number.isNaN(w) || Math.abs(w) < idle) {
          if (bus) return '';
          return `<path d="${d}" fill="none" style="stroke:var(--divider-color);stroke-width:2;stroke-dasharray:2 5"/>`;
        }
        const back  = w < 0;
        // Snelheid in px/s: ~13 bij 25 W, ~32 bij 1 kW, max 100 (vanaf ~4,4 kW).
        const speed = Math.min(100, 12 + Math.abs(w) * 0.02);
        const dur   = 12 / speed;
        const delay = -(now % dur);
        defs += `<marker id="pf-${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:${color}"/></marker>`;
        return `<path d="${d}" fill="none" ${back ? 'marker-start' : 'marker-end'}="url(#pf-${id})"
          style="stroke:${color};stroke-width:3;stroke-dasharray:6 6;animation:pfflow ${dur.toFixed(3)}s linear ${delay.toFixed(3)}s infinite ${back ? 'reverse' : 'normal'}"/>`;
      };
      const box = (x, y, w, h, k) =>
        `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" style="fill:${(C[k] || C.h3x)[1]};stroke:${(C[k] || C.h3x)[0]};stroke-width:2"/>`;
      const t = (x, y, txt, cls) => `<text x="${x}" y="${y}" class="${cls}">${txt}</text>`;

      // ---- Waarden ----
      const hasSchuur = !!(CFG.schuur && CFG.schuur.length);
      const pv   = num(CFG.pv);
      const net  = sum(CFG.net);
      const netL = (CFG.netPhases || []).map(num);
      const schR = hasSchuur ? sum(CFG.schuur) : NaN;
      const sch  = Number.isNaN(schR) ? NaN : Math.abs(schR);   // PV levert alleen
      const ac   = num(CFG.ac);
      const batP = num(CFG.batP);
      const soc  = num(CFG.soc);
      const huis = num(CFG.huis);
      const ems  = states[CFG.ems] ? states[CFG.ems].state : '—';
      const kwh  = CFG.batKwh ? num(CFG.batKwh)
                 : (CFG.capacity && !Number.isNaN(soc) ? CFG.capacity * soc / 100 : NaN);
      const tempRaw = states[CFG.heat] ? parseFloat(states[CFG.heat].state) : NaN;
      const tempC = unit(CFG.heat, '°C') === '°F' ? (tempRaw - 32) * 5 / 9 : tempRaw;   // altijd °C

      const netTxt = Number.isNaN(net) ? 'geen data'
        : net > CFG.netIdle ? 'Afname' : net < -CFG.netIdle ? 'Teruglevering' : 'In balans';
      // H3X status follows the battery first: the H3X itself draws ~30-50 W from
      // AC in stand-by, which must not read as charging.
      // Battery idle in User mode (Predbat power ref 0 %) = battery held, house on grid.
      const acIdle = 50;
      const acTxt  = Number.isNaN(ac) ? '\u2014'
        : batP > CFG.idle ? 'Ontladen'
        : ac > acIdle ? 'Levert PV'
        : batP < -CFG.idle ? 'Opladen'
        : /user/i.test(ems) ? 'Vasthouden'
        : 'Stand-by';
      const batTxt = Number.isNaN(batP) ? '—'
        : batP > CFG.idle ? 'Ontladen' : batP < -CFG.idle ? 'Laden' : 'Stand-by';

      // ---- Maatvoering (korter als er geen schuur-PV is) ----
      const H       = hasSchuur ? 400 : 305;
      const railEnd = hasSchuur ? 350 : 295;

      // ---- Lijnen (kleur van het bronblok; de pijl geeft de richting) ----
      const lines =
          line('dak',  'M150 50 H185',            pv,   C.pv[0])
        + line('bat',  'M260 160 V130',           batP, C.bat[0])
        + line('net',  'M150 185 H168 V295 H365', net,  C.net[0], CFG.netIdle)
        + (hasSchuur ? line('schuur', 'M150 350 H365', sch, C.pv[0]) : '')
        + line('ac',   'M335 65 H365',            ac,   'var(--secondary-text-color)', acIdle)
        + line('huis', 'M365 200 H395',           huis, C.huis[0]);
      // AC rail as a bus: each segment shows its own flow (Kirchhoff), so you can
      // follow H3X -> house or grid -> house along the rail without guessing.
      //   top    (H3X junction  -> house junction): H3X AC power, down = from H3X
      //   middle (grid junction -> house junction): grid + shed PV, up = towards house
      //   bottom (shed junction -> grid junction):  shed PV, up
      const schW  = hasSchuur && !Number.isNaN(sch) ? sch : 0;
      const midW  = Number.isNaN(net) ? NaN : net + schW;
      const midC  = midW < 0 ? 'var(--secondary-text-color)'
                  : (net > CFG.netIdle || schW <= CFG.idle) ? C.net[0] : C.pv[0];
      const midIdle = schW > CFG.idle ? CFG.idle : CFG.netIdle;
      const rail = `<path d="M365 65 V${railEnd}" fill="none" style="stroke:var(--secondary-text-color);stroke-width:2"/>`
        + line('r1', 'M365 65 V200',  ac,   'var(--secondary-text-color)', acIdle, true)
        + line('r2', 'M365 295 V200', midW, midC, midIdle, true)
        + (hasSchuur ? line('r3', 'M365 350 V295', sch, C.pv[0], CFG.idle, true) : '')
        + t(370, railEnd - 5, 'AC', 'ps');

      // ---- Batterij-vulling naar SoC ----
      const socC  = Number.isNaN(soc) ? 0 : Math.max(0, Math.min(100, soc));
      const fillH = 120 * socC / 100;
      const cFill = socC < 15 ? '#e53935' : socC < 30 ? '#fb8c00' : C.bat[0];
      defs += `<clipPath id="pf-batclip"><rect x="185" y="160" width="150" height="120" rx="10"/></clipPath>`;
      const batFill = `<rect x="185" y="${280 - fillH}" width="150" height="${fillH}" clip-path="url(#pf-batclip)" style="fill:${cFill};opacity:0.25"/>`;

      // ---- Blokken ----
      const pvSub = (CFG.pvStrings || [])
        .map(([lbl, id]) => `${lbl} ${fWs(num(id))}`).join(' · ') + ((CFG.pvStrings || []).length ? ' W' : '');
      const phaseX = [12, 58, 104];
      const phases = netL.length
        ? netL.map((v, i) => t(phaseX[i], 218, `L${i + 1}`, 'ps') + t(phaseX[i], 234, fWs(v), 'ps')).join('')
        : '';

      const blocks =
        // Dak-PV
          box(0, 0, 150, 100, 'pv')
        + t(12, 22, 'Dak-PV', 'pt')
        + t(12, 56, fW(pv), 'pb')
        + t(12, 80, pvSub, 'ps')
        // Net
        + box(0, 125, 150, 120, 'net')
        + t(12, 147, CFG.netLabel, 'pt')
        + t(12, 178, fW(net), 'pb')
        + t(12, 198, netTxt, 'ps')
        + phases
        // Schuur-PV (optioneel)
        + (hasSchuur
            ? box(0, 300, 150, 100, 'pv')
              + t(12, 322, 'Schuur-PV', 'pt')
              + t(12, 356, fW(sch), 'pb')
              + t(12, 380, Number.isNaN(sch) ? 'nog geen meting' : 'Growatt · CT2', 'ps')
            : '')
        // H3X omvormer
        + box(185, 0, 150, 130, 'h3x')
        + t(197, 22, 'H3X omvormer', 'pt')
        + t(197, 52, acTxt, 'pb')
        + t(197, 74, `AC ${fW(ac)}`, 'ps')
        + t(197, 96, `EMS: ${ems}`, 'ps')
        + t(197, 116, `Heatsink ${f1(tempC, ' °C')}`, 'ps')
        // Batterij
        + box(185, 160, 150, 120, 'bat') + batFill
        + t(197, 182, 'Batterij', 'pt')
        + t(197, 216, Number.isNaN(soc) ? '—' : `${Math.round(soc)} %`, 'pb2')
        + t(197, 238, `${batTxt} · ${f1(kwh / (CFG.batKwh ? (unit(CFG.batKwh, 'kWh') === 'Wh' ? 1000 : 1) : 1), ' kWh')}`, 'ps')
        + t(197, 266, `${f1(num(CFG.batV), ' V')} · ${f1(Math.abs(num(CFG.batA)), ' A')} · ${fW(batP)}`, 'ps')
        // Huis
        + box(395, 0, 125, H, 'huis')
        + t(407, 22, 'Huis', 'pt')
        + t(407, 56, fW(huis), 'pb')
        + t(407, 78, 'Totale load', 'ps');

      return `<svg viewBox="-2 -2 524 ${H + 4}" style="width:100%;max-width:620px;display:block;margin:0 auto" xmlns="http://www.w3.org/2000/svg">
        <defs>${defs}</defs>${rail}${lines}${blocks}</svg>`;
    ]]]
